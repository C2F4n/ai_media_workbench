# FrameFlow 运行包通用配置。数据库、邮箱分别填写同目录下的对应文件。
# 修改后先 Stop.cmd 再 Start.cmd；不用解压或重新构建 JAR。
# Java、FFmpeg、数据目录及后端监听地址/端口由启动脚本生成，不需要在这里填写绝对路径。

# 加载外部数据库与邮箱配置。optional 表示文件不存在时允许继续读取其他配置来源。
spring.config.import=optional:file:./config/database.properties,optional:file:./config/mail.properties

# 拼接 MySQL 连接地址：${变量名:默认值} 表示先读取变量，没有时使用默认值。
# createDatabaseIfNotExist=true 负责自动建库；UTC 选项统一连接时区；UTF-8 用于字符编码。
# 使用者通常只需修改 database.properties，不需要编辑这段地址。
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:frameflow}?createDatabaseIfNotExist=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}

# 数据库账号和密码，读取 database.properties 或同名环境变量。
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 是否强制 HTTPS。默认 false，配合运行包的本机 HTTP 入口进行测试。
# 部署 HTTPS 时需同时配置入口证书、受信代理及安全 Cookie，不能只改这一项。
app.transport.require-https=false

# 是否使用代理传来的转发信息。none 表示不处理；HTTPS 代理部署参考项目 public 配置。
server.forward-headers-strategy=none

# 登录 Cookie 是否只允许经 HTTPS 发送。HTTP 测试保持 false，HTTPS 部署应设为 true。
app.auth.cookie-secure=false

# 是否启用服务端本地模型的接入。默认关闭；设为 true 不会自动下载或启动模型。
# 需要另行准备推理服务，端口/模型等使用项目的 app.local-ai.* 配置；云端凭据在网页中设置。
app.local-ai.enabled=${LOCAL_AI_ENABLED:false}

# 是否允许注册。true 还需要 mail.properties 中启用并正确配置发信；false 则关闭注册入口。
app.auth.registration-enabled=true

