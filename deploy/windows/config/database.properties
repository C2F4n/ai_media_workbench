# 数据库配置：先自行安装、启动 MySQL 8.x，再填写本文件。
# 修改后先运行 Stop.cmd，再运行 Start.cmd；不需要重新构建 JAR。
# 每行填写“配置名=值”，值不要加引号；注释单独写一行，不要接在密码后面。
# 密码中的字面反斜杠需要写成两个反斜杠；本文件不要发给别人或提交 GitHub。

# MySQL 所在主机。本机数据库填 127.0.0.1，远程数据库填实际 IP 或域名。
# 这里是数据库地址，与浏览器访问网站的 IP/端口无关。
DB_HOST=127.0.0.1

# MySQL 监听端口，通常为 3306；改过数据库端口时填写实际值。
DB_PORT=3306

# 数据库名称，建议只用英文字母、数字和下划线，例如 frameflow。
# 不存在时自动创建，再自动创建/升级数据表；首次启动的账号需要建库、建表权限。
# 建议与开发环境使用不同库名，避免混用现有账号和素材记录。
DB_NAME=frameflow

# MySQL 用户名，不是网站登录用户名。将占位文字替换为自己的数据库账号，例如 root。
DB_USERNAME=your_database_user

# 上述 MySQL 账号的密码。等号后填写实际密码；只有无密码账号才保留为空。
DB_PASSWORD=

# 高级用法：环境变量 DB_URL 可覆盖自动生成的 JDBC 地址。
# 自定义 URL 时请保留 createDatabaseIfNotExist=true，否则不会自动建库。
# DB_HOST、DB_PORT、DB_NAME、DB_USERNAME、DB_PASSWORD 同名环境变量也可覆盖文件中的值。

