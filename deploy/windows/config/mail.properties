# 邮箱发信配置：用于注册验证码，不会改变数据库连接。
# 修改后先 Stop.cmd 再 Start.cmd。此文件不附带任何私人邮箱或授权码。
# 值不要加引号；密码中的字面反斜杠写成两个反斜杠，注释单独占一行。

# 是否启用注册验证码发信：true 启用，false 关闭。
# 当前注册流程要求验证邮箱；关闭发信时也不会开放注册，而不是跳过验证码。
# 下方参数填写完整、邮箱已开通 SMTP 后，再改为 true。
REGISTRATION_MAIL_ENABLED=false

# 邮箱服务商的 SMTP 服务器，不要填网页邮箱地址，不要加 http://。
# QQ 邮箱示例为 smtp.qq.com；其他邮箱以服务商公布的地址为准。
SMTP_HOST=smtp.qq.com

# SMTP 端口：下方默认组合为 465 + SSL。
# 服务商要求 587 时通常需要 SSL=false、STARTTLS=true，不能只改端口。
SMTP_PORT=465

# SMTP 登录账号，通常是完整发信邮箱，例如 example@qq.com。
SMTP_USERNAME=

# SMTP 授权码或服务商要求的应用密码，通常不是网页登录密码。
# 请在本机填写，不要发到聊天、公开仓库或共享运行包中。
SMTP_PASSWORD=

# 邮件显示的发件地址，通常与 SMTP_USERNAME 填写同一个完整邮箱。
SMTP_FROM=

# 是否进行 SMTP 用户身份认证。普通个人邮箱通常保持 true。
SMTP_AUTH=true

# 是否从连接建立时就使用 SSL/TLS。使用 465 端口时通常保持 true。
SMTP_SSL_ENABLED=true

# 是否通过 STARTTLS 将连接升级为 TLS。使用 587 时通常设为 true，并关闭上面的 SSL。
SMTP_STARTTLS_ENABLED=false

# 同名环境变量可覆盖本文件；保存成功不代表已实际发送邮件，以网页和日志中的结果为准。

