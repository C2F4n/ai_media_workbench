spring.datasource.url=jdbc:h2:mem:workbench_tests;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.session.jdbc.platform=h2
app.auth.login-attempts=1000
app.auth.registration-attempts=1000
app.registration-mail.send-attempts=1000
app.account-cleanup.enabled=false
app.media-tool.worker-enabled=false
app.transcode.worker-enabled=false
