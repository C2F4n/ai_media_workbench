spring.application.name=ai_media_workbench
# 本机私有配置不进入Git；没有该文件时，其他环境仍可直接使用环境变量。
spring.config.import=optional:file:./.local/database.properties

# ${环境变量:默认值} 允许启动时覆盖；本机当前通过 SERVER_PORT=8081 供 Nginx 8088 转发。
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:${local.server.port:8080}}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_media_workbench?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
# 环境变量优先，本机可使用被Git忽略的私有配置；.env文件不会自动加载。
spring.datasource.password=${DB_PASSWORD:${local.database.password:}}
# Flyway 按版本执行 db/migration，包含会话表，因此禁止 Spring Session 再自动建表。
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
spring.jackson.deserialization.fail-on-unknown-properties=true
# 上传限制和能力查询使用同一 app.media 配置，避免页面声明与后端限制分散维护。
spring.servlet.multipart.max-file-size=${app.media.max-upload-size}
# MediaUploadConfig 在文件上限之外为 multipart 协议保留 1MiB，不放宽单文件限制。

mybatis.mapper-locations=classpath:mapper/*.xml
# 例如数据库 password_hash 自动映射到 Java passwordHash。
mybatis.configuration.map-underscore-to-camel-case=true

# 本机 HTTP 可用 false；部署 HTTPS 时设 COOKIE_SECURE=true，禁止 Cookie 经 HTTP 发送。
app.auth.cookie-secure=${COOKIE_SECURE:false}
# idle 是最后一次访问后的空闲期限，absolute 是登录时起算的最长有效期。
app.auth.session-idle-timeout=30m
app.auth.session-absolute-timeout=12h
app.auth.remember-idle-timeout=7d
app.auth.remember-absolute-timeout=30d
app.auth.registration-enabled=${REGISTRATION_ENABLED:true}
app.auth.login-attempts=10
app.auth.registration-attempts=5
app.auth.rate-limit-window=5m

# 注册必须先验证邮箱；未配置真实发信服务时不会开放注册。
app.registration-mail.enabled=${REGISTRATION_MAIL_ENABLED:false}
# 未启用邮件功能时不探测空 SMTP 配置；启用后仍如实报告邮件依赖故障。
management.health.mail.enabled=${app.registration-mail.enabled}
app.registration-mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.registration-mail.code-ttl=10m
app.registration-mail.max-attempts=5
app.registration-mail.send-attempts=3
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 注销清理只处理此根目录内的文件；相对路径以应用启动工作目录为基准。
app.storage.root=${MEDIA_STORAGE_ROOT:./storage}
app.account-cleanup.enabled=${ACCOUNT_CLEANUP_ENABLED:true}
app.account-cleanup.interval-ms=${ACCOUNT_CLEANUP_INTERVAL_MS:5000}

app.media.max-upload-size=${MEDIA_MAX_UPLOAD_SIZE:3GB}
app.media.max-duration=${MEDIA_MAX_DURATION:15m}

app.media-tool.ffprobe=${FFPROBE_PATH:ffprobe}
app.media-tool.timeout=20s
app.media-tool.lease=2m
app.media-tool.interval-ms=1000
app.media-tool.worker-enabled=${MEDIA_PROBE_WORKER_ENABLED:true}

app.transcode.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.transcode.timeout=${TRANSCODE_TIMEOUT:5m}
app.transcode.lease=7m
app.transcode.queue-limit=20
app.transcode.max-output-size=${TRANSCODE_MAX_OUTPUT_SIZE:3GB}
app.transcode.worker-enabled=${TRANSCODE_WORKER_ENABLED:true}

# 个人云端调用固定使用官方域名；SERVER来源仅使用本地千问，不再读取站点云端额度。
app.cloud-credentials.key-file=${CLOUD_CREDENTIALS_KEY_FILE:./.local/cloud-credentials.key}

app.local-ai.enabled=${LOCAL_AI_ENABLED:true}
app.local-ai.port=${LOCAL_AI_PORT:18565}
app.local-ai.model=${LOCAL_AI_MODEL:qwen3.5-4b}
app.local-ai.api-key=${LOCAL_AI_API_KEY:}
